name: Build DMG

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # tạo GitHub Release khi push tag

jobs:
  dmg:
    runs-on: macos-latest
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Tùy chọn: có secrets thì ký bằng Developer ID hoặc chứng chỉ tự ký cố định, không thì ký ad-hoc
      - name: Import signing certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" ]]; then echo "identity=-" >> "$GITHUB_OUTPUT"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          # chứng chỉ tự ký không "valid" (không có -v) nhưng codesign vẫn dùng được; ưu tiên Developer ID nếu có
          ALL=$(security find-identity -p codesigning "$KC")
          ID=$(echo "$ALL" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/' || true)
          [[ -n "$ID" ]] || ID=$(echo "$ALL" | grep -E '^\s+[0-9]+\) ' | head -1 | sed -E 's/.*"(.*)".*/\1/')
          [[ -n "$ID" ]] || { echo "Không tìm thấy identity ký trong chứng chỉ"; exit 1; }
          echo "identity=$ID" >> "$GITHUB_OUTPUT"

      - name: Build app (universal)
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: ./build.sh

      - name: Make DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: ./scripts/make-dmg.sh

      # Tùy chọn: công chứng (cần Apple Developer + secrets APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD)
      - name: Notarize
        if: ${{ startsWith(steps.sign.outputs.identity, 'Developer ID') && env.APPLE_ID != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(ls build/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: SyncNotification-dmg
          path: build/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
